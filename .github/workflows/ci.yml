name: CI

# Roda a cada push, em qualquer branch.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-e-testes:
    name: build-e-testes
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: chave-somente-para-testes-no-ci
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v5

      - name: Instalar o Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build, instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Verificar o projeto Django
        run: python manage.py check

      - name: Verificar se há migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar os testes automatizados com cobertura
        run: |
          coverage run --source=financeiro,config --omit="*/migrations/*,*/tests/*,*/wsgi.py,*/asgi.py" manage.py test
          coverage report
